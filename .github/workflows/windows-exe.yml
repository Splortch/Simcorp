name: Build SimCorp Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop_launcher.py"
      - ".github/workflows/windows-exe.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop_launcher.py"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic httpx pywebview pyinstaller pytest

      - name: Run backend tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "backend"
          python -m pytest backend/tests -q

      - name: Package desktop app
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name SimCorp
          --paths backend
          --add-data "frontend/dist;frontend/dist"
          --collect-submodules simcorp
          --collect-all webview
          desktop_launcher.py

      - name: Create portable ZIP
        run: Compress-Archive -Path dist/SimCorp -DestinationPath SimCorp-Windows-x64.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SimCorp-Windows-x64
          path: SimCorp-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
