name: Build and publish SimCorp release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and test Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic httpx pywebview pyinstaller pytest

      - name: Run backend tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "backend"
          python -m pytest backend/tests -q

      - name: Package desktop app
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name SimCorp
          --paths backend
          --add-data "frontend/dist;frontend/dist"
          --collect-submodules simcorp
          --collect-all webview
          desktop_launcher.py

      - name: Create portable ZIP
        run: Compress-Archive -Path dist/SimCorp -DestinationPath SimCorp-Windows-x64.zip -Force

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: SimCorp-Windows-x64
          path: SimCorp-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download tested Windows package
        uses: actions/download-artifact@v4
        with:
          name: SimCorp-Windows-x64
          path: release-assets

      - name: Create GitHub release and attach EXE package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/SimCorp-Windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "SimCorp $RELEASE_TAG"
